<!DOCTYPE html>

<head>

</head>
<style>

        padding: 0%;
        margin: 0%;
        box-sizing: border-box;
    }
    body{
        display: flex;

        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;

    div{

        border-radius: 5px;

    <div>
        <h1>Password Reset</h1>
